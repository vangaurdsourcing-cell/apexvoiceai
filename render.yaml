services:
  - type: web
    name: apex-ai-platform
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: BRAND_NAME
        value: Apex AI
      - key: SARVAM_API_KEY
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0
